[package]
name = "agentcursor"
version = "0.5.0"
edition = "2021"
description = "Computer use for AI agents with its own cursor: one small binary, MCP + CLI, works in the background."
license = "MIT"
repository = "https://github.com/kumard3/agentcursor"

[[bin]]
name = "agentcursor"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = { version = "0.25.0", features = ["elcapitan", "highsierra"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSColor", "NSBezierPath", "NSGraphics", "NSRunningApplication", "NSWorkspace", "NSEvent", "NSScreen", "libc", "objc2-core-foundation"] }
objc2-foundation = "0.3.2"
